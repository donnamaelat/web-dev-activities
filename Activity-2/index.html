<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>IskoFind</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
</head>

<body>

    <div class="header-wrap container pt-3">
        <div class="header-bar">
            <div class="d-flex justify-content-between align-items-center py-3 px-4">
                <div class="d-flex align-items-center">
                    <div class="logo-icon rounded-4 d-flex justify-content-center align-items-center">
                        <img src="images/pin-white.svg" alt="Pin" class="logo-pin" />
                    </div>
                    <div class="logo-text ms-3">IskoFind</div>
                </div>
                <div class="nav-link-text">Study Spots</div>
            </div>
        </div>
    </div>


    <div class="container hero">
        <div class="pill-label rounded-pill">
            <img src="images/pin-blue.svg" alt="Pin" class="pill-pin" /> Study Spots near PUP
        </div>
        <h1 class="hero-title mt-4">
            Find your next<br />
            <span class="gradient-text">study spot.</span>
        </h1>
        <p class="hero-text mt-3">
            Discover quiet, comfortable, and budget-friendly places to study around
            campus.
        </p>
    </div>


    <div class="container">
        <div class="row row-cols-1 row-cols-md-3 g-4" id="parent">

        </div>
    </div>

    <div class="container footer-line mt-5 py-3">
        <span class="gradient-text">IskoFind</span> · A simple guide for PUP
        students
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        var spots = [
            {
                name: "PUP Sto. Tomas Library",
                description: "The campus library, a quiet on-campus space for study and research.",
                price: "Free",
                image: "images/pup-library.jpg",
                map: "https://maps.google.com/maps?cid=15039983652105805881",
            },
            {
                name: "But First, Coffee",
                description: "A bright, student-friendly café with extended hours for late study sessions.",
                price: "Under ₱500",
                image: "images/bfc.jpg",
                map: "https://maps.google.com/maps?cid=11475339472633486776",
            },
            {
                name: "Coffee Buddy",
                description: "A budget-friendly café near campus with free Wi-Fi. Power outlets are limited, so charge your devices beforehand.",
                price: "Under ₱500",
                image: "images/coffee-buddy.jpg",
                map: "https://maps.google.com/maps?cid=17490797363386172923",
            },
            {
                name: "Variables Specialty Coffee",
                description: "A calm café with Wi-Fi that is typically quiet on weekdays, suited for focused work.",
                price: "Under ₱500",
                image: "images/variables.jpg",
                map: "https://maps.google.com/maps?cid=14287501278967515194",
            },
            {
                name: "Figaro Coffee (SM Sto. Tomas)",
                description: "A mall-based café with ample seating. Outdoor tables are generally more comfortable.",
                price: "₱1–1000",
                image: "images/figaro.jpg",
                map: "https://maps.google.com/maps?cid=5347281878867517370",
            },
            {
                name: "Krāv Café",
                description: "A cozy café with reliable Wi-Fi, a good option for longer study sessions. About 1.5 km from campus.",
                price: "Under ₱500",
                image: "images/krav-cafe.jpg",
                map: "https://maps.google.com/maps?cid=12887979887051919885",
            },
        ];
        var elParent = document.getElementById("parent");

        for (var i = 0; i < spots.length; i++) {
            elParent.innerHTML +=
                `<div class="col">
            <div class="card spot-card p-3 h-100 shadow rounded-4">
              <img src="` + spots[i].image + `" alt="` + spots[i].name + `" class="spot-img rounded-4" />
              <div class="spot-name mt-3">` + spots[i].name + `</div>
              <div class="spot-description mt-1">` + spots[i].description + `</div>
              <div class="d-flex justify-content-between align-items-center mt-auto pt-3">
                <span class="price-pill rounded-pill">` + spots[i].price + `</span>
                <a href="` + spots[i].map + `" target="_blank" rel="noopener" class="arrow-btn rounded-circle text-decoration-none" aria-label="View on map"><img src="images/pin-blue.svg" alt="" class="map-icon" /></a>
              </div>
            </div>
          </div>`;
        }
    </script>
</body>

</html>
