<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>IskoFind</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
</head>

<body>

    <div class="header-wrap container pt-3">
        <div class="header-bar">
            <div class="d-flex justify-content-between align-items-center py-3 px-4">
                <div class="d-flex align-items-center">
                    <div class="logo-icon rounded-4 d-flex justify-content-center align-items-center">
                        <img src="images/pin-white.svg" alt="Pin" class="logo-pin" />
                    </div>
                    <div class="logo-text ms-3">IskoFind</div>
                </div>
                <div class="nav-link-text">Study Spots</div>
            </div>
        </div>
    </div>


    <div class="container hero">
        <div class="pill-label rounded-pill">
            <img src="images/pin-blue.svg" alt="Pin" class="pill-pin" /> Study Spots near PUP
        </div>
        <h1 class="hero-title mt-4">
            Find your next<br />
            <span class="gradient-text">study spot.</span>
        </h1>
        <p class="hero-text mt-3">
            Discover quiet, comfortable, and budget-friendly places to study around
            campus.
        </p>
    </div>


    <div class="container">
        <div class="row row-cols-1 row-cols-md-3 g-4" id="parent">

        </div>
    </div>

    <div class="container footer-line mt-5 py-3">
        <span class="gradient-text">IskoFind</span> · A simple guide for PUP
        students
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        var spots = [
            {
                name: "But First, Coffee",
                description: "Cozy café na pwedeng tambayan para sa study sessions.",
                price: "₱100–150",
                image: "images/butfirst.jpg",
                source: "https://www.facebook.com/share/1CkDdj9jtm/",
            },
            {
                name: "Coffee Buddy",
                description: "Affordable coffee spot sa Poblacion, Sto. Tomas.",
                price: "₱80–120",
                image: "images/coffeebuddy.jpg",
                source: "https://www.facebook.com/share/1536fnKUi21/",
            },
            {
                name: "Figaro Coffee Company",
                description: "Coffee, Wi-Fi, and outlets for longer study sessions.",
                price: "₱120–180",
                image: "images/figaro.jpg",
                source: "https://www.facebook.com/share/1dPV8bRgBr/",
            },
            {
                name: "Krav Café",
                description: "Chill na café na may aircon at maayos na seating.",
                price: "₱100–150",
                image: "images/krav.jpg",
                source: "https://www.facebook.com/share/1DLXMokigu/",
            },
            {
                name: "Variables Café",
                description: "Bright, peaceful space na maganda para mag-review.",
                price: "₱120–180",
                image: "images/variables.jpg",
                source: "https://www.facebook.com/share/1cyABgZ8RX/",
            },
            {
                name: "PUP Study Area",
                description: "Quiet study space sa loob ng campus.",
                price: "Free",
                image: "images/pup.jpg",
                source: "https://www.facebook.com/share/1Bcpo1mhDD/",
            },
        ];

        var elParent = document.getElementById("parent");

        for (var i = 0; i < spots.length; i++) {
            elParent.innerHTML +=
                `<div class="col">
            <div class="card spot-card p-3 h-100 shadow rounded-4">
              <img src="` + spots[i].image + `" alt="` + spots[i].name + `" class="spot-img rounded-4" />
              <div class="spot-name mt-3">` + spots[i].name + `</div>
              <div class="spot-description mt-1">` + spots[i].description + `</div>
              <div class="d-flex justify-content-between align-items-center mt-auto pt-3">
                <span class="price-pill rounded-pill">` + spots[i].price + `</span>
                <a href="` + spots[i].source + `" target="_blank" class="arrow-btn rounded-circle text-decoration-none">
                <img src="images/pin-blue.svg" alt="Location" class="arrow-icon" />
                </a>
              </div>
            </div>
          </div>`;
        }
    </script>
</body>

</html>
