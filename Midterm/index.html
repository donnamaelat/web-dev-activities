<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valorant Weapons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid bg-danger position-fixed top-0 z-1 shadow">
    <div class="row">
      <div class="col">
        <div class="text-center display-6 text-white py-3">Valorant Armory</div>
      </div>
    </div>
  </div>

  <div class="container mt-5 pt-5">
    <nav aria-label="Page navigation example">
      <ul class="pagination">
        <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
        <li class="page-item"><a class="page-link" id="currentpage">1</a></li>
        <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <div class="row" id="parent">

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    const colors = {
      Sidearm: '#DEF3FD',
      SMG: '#DEFDE0',
      Shotgun: '#f8d5a3',
      Rifle: '#FDDFDF',
      Sniper: '#cbc3e3',
      Heavy: '#eaeda1',
      Melee: '#F5F5F5'
    };

    // element initializations
    var elCurrentPage = document.getElementById("currentpage");
    var elParent = document.getElementById("parent");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = urlParams.get('page');
    if (page == null) {
      page = 1;
    } else {
      page = parseInt(page);
    }

    // pagination variables
    var weapons = [];
    var lastWeapon = 0;
    var perPage = 8;
    var finalPage = 1;

    const getWeapons = async () => {
      elParent.innerHTML = `
        <div class="col text-center my-5">
          <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      `;

      const response = await fetch('https://valorant-api.com/v1/weapons');
      const result = await response.json();
      weapons = result.data;

      lastWeapon = weapons.length;
      finalPage = Math.ceil(lastWeapon / perPage);

      showWeapons();
    }

    const showWeapons = () => {
      elParent.innerHTML = '';
      elCurrentPage.innerHTML = page;

      for (var i = ((page - 1) * perPage); i < page * perPage; i++) {

        if (i >= lastWeapon) {
          break;
        }

        var weapon = weapons[i];

        var id = weapon.uuid;
        var name = weapon.displayName;
        var image = weapon.displayIcon;
        var category = weapon.category.split("::")[1];
        var color = colors[category];

        elParent.innerHTML += `
          <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <a style="text-decoration: none" class="text-body" href="view.html?id=` + id + `&page=` + page + `">
              <div class="card shadow-sm p-3 my-3 text-center">
                <div class="rounded-4 p-3 d-flex align-items-center justify-content-center bg-dark" style="height: 120px;">
                  <img class="img-fluid mh-100" src="` + image + `">
                </div>
                <div class="h4 mt-3 mb-2">` + name + `</div>
                <div>
                  <span class="rounded-pill px-3" style="background-color: ` + color + `;">` + category + `</span>
                </div>
              </div>
            </a>
          </div>
        `;
      }
    }

    //pagination functions
    function prev() {
      page -= 1;
      if (page == 0) {
        page = finalPage;
      }
      showWeapons();
    }

    function next() {
      page += 1;
      if (page > finalPage) {
        page = 1;
      }
      showWeapons();
    }

    getWeapons();
  </script>
</body>

</html>
