<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valorant Weapons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top valo-nav">
    <div class="container-fluid px-4">

      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img class="valo-logo me-2" src="images/valo icon.png" alt="Valorant">
        <span class="valo-logo-text">VALORANT</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#valoNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="valoNav">
        <ul class="navbar-nav mx-lg-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Arsenal</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Agents</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Maps</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Collection</a></li>
        </ul>

        <form class="valo-search d-flex align-items-center my-2 my-lg-0" onsubmit="return false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9aa3" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
          <input type="text" id="search" placeholder="Search for a weapon...">
        </form>
      </div>

    </div>
  </nav>

  <div class="container-fluid valo-layout">
    <div class="row">

      <aside class="col-lg-2 d-none d-lg-block">
        <div class="valo-sidebar">
          <ul class="list-unstyled mb-0">
            <li><a class="side-link active" data-category="All" onclick="setCategory('All')">
                <svg class="side-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" />
                </svg>All</a></li>
            <li><a class="side-link" data-category="Sidearm" data-icon="Classic" onclick="setCategory('Sidearm')"><img
                  class="side-icon" alt="">Sidearms</a></li>
            <li><a class="side-link" data-category="SMG" data-icon="Stinger" onclick="setCategory('SMG')"><img
                  class="side-icon" alt="">SMGs</a></li>
            <li><a class="side-link" data-category="Rifle" data-icon="Vandal" onclick="setCategory('Rifle')"><img
                  class="side-icon" alt="">Rifles</a></li>
            <li><a class="side-link" data-category="Sniper" data-icon="Operator" onclick="setCategory('Sniper')"><img
                  class="side-icon" alt="">Snipers</a></li>
            <li><a class="side-link" data-category="Shotgun" data-icon="Bucky" onclick="setCategory('Shotgun')"><img
                  class="side-icon" alt="">Shotguns</a></li>
            <li><a class="side-link" data-category="Heavy" data-icon="Odin" onclick="setCategory('Heavy')"><img
                  class="side-icon" alt="">Machine Guns</a></li>
            <li><a class="side-link" data-category="Melee" data-icon="Melee" onclick="setCategory('Melee')"><img
                  class="side-icon" alt="">Melee</a></li>
          </ul>
          <div class="valo-side-bottom">
            <img class="valo-side-logo" src="images/valo icon.png" alt="Valorant">
            <div class="valo-tagline">DEFY<br>THE<br>LIMITS</div>
          </div>
        </div>
      </aside>

      <main class="col-12 col-lg-10">
        <nav aria-label="Page navigation example">
          <ul class="pagination">
            <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
            <li class="page-item"><a class="page-link" id="currentpage">1</a></li>
            <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
          </ul>
        </nav>

        <div class="row" id="parent">

        </div>
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

  <script>
    const colors = {
      Sidearm: '#DEF3FD',
      SMG: '#DEFDE0',
      Shotgun: '#f8d5a3',
      Rifle: '#FDDFDF',
      Sniper: '#cbc3e3',
      Heavy: '#eaeda1',
      Melee: '#F5F5F5'
    };

    // element initializations
    var elCurrentPage = document.getElementById("currentpage");
    var elParent = document.getElementById("parent");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = urlParams.get('page');
    if (page == null) {
      page = 1;
    } else {
      page = parseInt(page);
    }

    //pagination variables
    var allWeapons = [];
    var weapons = [];
    var currentCategory = "All";
    var lastWeapon = 0;
    var perPage = 8;
    var finalPage = 1;

    const getWeapons = async () => {
      elParent.innerHTML = `
        <div class="col text-center my-5">
          <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      `;

      const response = await fetch('https://valorant-api.com/v1/weapons');
      const result = await response.json();
      allWeapons = result.data;

      showIcons();
      applyFilter();
    }

    const showIcons = () => {
      var links = document.getElementsByClassName("side-link");

      for (var i = 0; i < links.length; i++) {
        var iconName = links[i].getAttribute("data-icon");

        if (iconName != null) {
          for (var j = 0; j < allWeapons.length; j++) {
            if (allWeapons[j].displayName == iconName) {
              links[i].getElementsByTagName("img")[0].src = allWeapons[j].displayIcon;
            }
          }
        }
      }
    }

    const applyFilter = () => {
      weapons = [];

      for (var i = 0; i < allWeapons.length; i++) {
        var category = allWeapons[i].category.split("::")[1];

        if (currentCategory == "All" || currentCategory == category) {
          weapons.push(allWeapons[i]);
        }
      }

      lastWeapon = weapons.length;
      finalPage = Math.ceil(lastWeapon / perPage);

      showWeapons();
    }

    const showWeapons = () => {
      elParent.innerHTML = '';
      elCurrentPage.innerHTML = page;

      for (var i = ((page - 1) * perPage); i < page * perPage; i++) {

        if (i >= lastWeapon) {
          break;
        }

        var weapon = weapons[i];

        var id = weapon.uuid;
        var name = weapon.displayName;
        var image = weapon.displayIcon;
        var category = weapon.category.split("::")[1];
        var number = "" + (i + 1);
        var total = "" + lastWeapon;
        while (number.length < 3) {
          number = "0" + number;
        }
        while (total.length < 3) {
          total = "0" + total;
        }

        var damage = "-";
        var magazine = "-";
        var fireRate = "-";

        if (weapon.weaponStats != null) {
          damage = weapon.weaponStats.damageRanges[0].bodyDamage;
          magazine = weapon.weaponStats.magazineSize;
          fireRate = weapon.weaponStats.fireRate;
        }

        elParent.innerHTML += `
          <div class="col-12 col-md-6 col-xl-4">
            <a class="valo-card" href="view.html?id=` + id + `&page=` + page + `">
              <div class="valo-card-top">
                <span class="valo-card-category">` + category + `</span>
                <span>` + number + ` / ` + total + `</span>
              </div>
              <div class="valo-card-image">
                <img src="` + image + `">
              </div>
              <div class="valo-card-name">
                ` + name + `
                <img src="images/valo icon.png" alt="">
              </div>
              <div class="valo-card-stats">
                <div>
                  <div class="stat-label">Damage</div>
                  <div class="stat-value">` + damage + `</div>
                </div>
                <div>
                  <div class="stat-label">Magazine</div>
                  <div class="stat-value">` + magazine + `</div>
                </div>
                <div>
                  <div class="stat-label">Fire rate</div>
                  <div class="stat-value">` + fireRate + `</div>
                </div>
              </div>
              <div class="valo-card-view">&raquo; View details</div>
            </a>
          </div>
        `;
      }
    }

    //pagination functions
    function prev() {
      page -= 1;
      if (page == 0) {
        page = finalPage;
      }
      showWeapons();
    }

    function next() {
      page += 1;
      if (page > finalPage) {
        page = 1;
      }
      showWeapons();
    }

    //sidebar function
    function setCategory(category) {
      currentCategory = category;
      page = 1;

      var links = document.getElementsByClassName("side-link");
      for (var i = 0; i < links.length; i++) {
        if (links[i].getAttribute("data-category") == category) {
          links[i].classList.add("active");
        } else {
          links[i].classList.remove("active");
        }
      }

      applyFilter();
    }

    getWeapons();
  </script>
</body>

</html>
