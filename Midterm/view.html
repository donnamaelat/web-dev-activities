<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weapon Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top valo-nav">
    <div class="container-fluid px-4">

      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img class="valo-logo me-2" src="images/valo icon.png" alt="Valorant">
        <span class="valo-logo-text">VALORANT</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#valoNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="valoNav">
        <ul class="navbar-nav mx-lg-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Arsenal</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Agents</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Maps</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Collection</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <div class="container valo-view">
    <a href="index.html" id="backlink" class="view-back">&lsaquo; Back to list</a>

    <div class="row align-items-center mt-4">
      <div class="col-12 col-lg-4">
        <img class="view-logo" src="images/valo icon.png" alt="Valorant">
        <div class="view-category" id="category"></div>
        <div class="view-name" id="name">
          <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <div class="view-cost" id="cost"></div>
      </div>
      <div class="col-12 col-lg-8 text-center">
        <img src="" class="img-fluid view-weapon" id="image">
      </div>
    </div>

    <div class="row mt-4 mb-5">
      <div class="col-12 col-lg-5 mb-3">
        <div class="view-panel">
          <div class="view-panel-title">Overview</div>
          <div id="stats"></div>
        </div>
      </div>
      <div class="col-12 col-lg-7 mb-3">
        <div class="view-panel">
          <div class="view-panel-title">Damage by distance</div>
          <div class="table-responsive" id="damage"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <script>
    const colors = {
      Sidearm: '#DEF3FD',
      SMG: '#DEFDE0',
      Shotgun: '#f8d5a3',
      Rifle: '#FDDFDF',
      Sniper: '#cbc3e3',
      Heavy: '#eaeda1',
      Melee: '#F5F5F5'
    };

    var elName = document.getElementById("name");
    var elImage = document.getElementById("image");
    var elCategory = document.getElementById("category");
    var elBacklink = document.getElementById("backlink");
    var elStats = document.getElementById("stats");
    var elDamage = document.getElementById("damage");
    var elCost = document.getElementById("cost");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const id = urlParams.get('id');
    const page = urlParams.get('page');
    const backCategory = urlParams.get('category');

    if (page != null) {
      elBacklink.href = "index.html?page=" + page;

      if (backCategory != null) {
        elBacklink.href += "&category=" + backCategory;
      }
    }

    const getWeapon = async () => {
      elName.innerHTML = `
        <div class="spinner-border text-danger" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      `;
      elImage.src = "";
      elCategory.innerHTML = "";

      const response = await fetch('https://valorant-api.com/v1/weapons/' + id);
      const result = await response.json();
      const weapon = result.data;

      var category = weapon.category.split("::")[1];
      if (category == "Heavy") {
        category = "Machine Gun";
      }

      elName.innerHTML = weapon.displayName;
      elImage.src = weapon.displayIcon;
      elCategory.innerHTML = category;

      if (weapon.shopData != null) {
        elCost.innerHTML = weapon.shopData.cost;
      }

      if (weapon.weaponStats == null) {
        elStats.innerHTML = '<div class="p-4 text-center stat-none">No stats available for this weapon.</div>';
        return;
      }

      var stats = weapon.weaponStats;

      elStats.innerHTML = `
        <div class="stat-row"><span>Magazine capacity</span><b>` + stats.magazineSize + ` rounds</b></div>
        <div class="stat-row"><span>Fire rate</span><b>` + stats.fireRate + ` rds/sec</b></div>
        <div class="stat-row"><span>Reload duration</span><b>` + stats.reloadTimeSeconds + ` sec</b></div>
        <div class="stat-row"><span>Equip duration</span><b>` + stats.equipTimeSeconds + ` sec</b></div>
        <div class="stat-row"><span>Wall penetration</span><b>` + stats.wallPenetration.split("::")[1] + `</b></div>
      `;

      var rows = '';
      for (var i = 0; i < stats.damageRanges.length; i++) {
        var d = stats.damageRanges[i];
        rows += `
          <tr>
            <td>` + d.rangeStartMeters + ` - ` + d.rangeEndMeters + ` m</td>
            <td>` + d.headDamage + `</td>
            <td>` + d.bodyDamage + `</td>
            <td>` + d.legDamage + `</td>
          </tr>
        `;
      }

      elDamage.innerHTML = `
        <table class="table valo-table text-center">
          <thead>
            <tr><th>Range</th><th>Head</th><th>Body</th><th>Legs</th></tr>
          </thead>
          <tbody>` + rows + `</tbody>
        </table>
      `;
    }

    if (id != null) {
      getWeapon();
    }
  </script>
</body>

</html>
